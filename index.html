   "Mes limites sont claires et je veux qu’elles restent stables","Certaines choses pourraient évoluer","J’aime explorer progressivement",
   "Ça dépend complètement du sujet","Je préfère décider au cas par cas","Franchement, impossible à prévoir pour l’instant"
  ],{isRequired:true})
 ]
},
{
 name:"hard", title:"Tes vraies lignes rouges", visibleIf:"{AGE_OK} = 'YES'",
 elements:[
  html("hardIntro","<div class='note'>Cette étape ne sert pas à négocier tes réponses. Elle sert à distinguer un « pas maintenant » d’une vraie limite non négociable.</div>"),
  multi("HARD_LIMITS","Parmi les éléments refusés dans le questionnaire, lesquels sont de vraies limites non négociables ?",["Autre limite non listée"]),
  {type:"comment",name:"HARD_OTHER",title:"Est-ce qu’il existe une autre ligne rouge qu’on n’a pas abordée ?"},
  html("hardRule","<div class='small'>Toute pratique sélectionnée comme limite non négociable est exclue des recommandations, stratégies, offres et scénarios générés.</div>")
 ]
}
];

const json = {
 title:"QCM stratégique — Créateur de contenu adulte",
 description:"23 questions communes + branches conditionnelles. Une curiosité n’est pas une autorisation commerciale. « Plus tard » n’est pas disponible maintenant.",
 showProgressBar:"top", progressBarType:"pages", showQuestionNumbers:"off",
 showPrevButton:true, checkErrorsMode:"onNextButton", pages
};

const survey = new Survey.Model(json);
survey.locale="fr";

const storageKey="qcm-v1.3-draft";
const started=Date.now();
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
 if(saved) survey.data=saved;
}catch(e){}
survey.onValueChanged.add(s=>localStorage.setItem(storageKey,JSON.stringify(s.data)));

function collectHardCandidates(data){
 const out=new Set();
 function scan(v,key){
   if(v===C.NEVER || v===C.NO || v==="NOT_FOR_ME" || v==="UNREALISTIC") { if(key) out.add(key); return; }
   if(v && typeof v==="object"){
     Object.entries(v).forEach(([k,x])=>{
       if(x && typeof x==="object" && x.commercial==="Jamais") out.add(k);
       scan(x,k);
     });
   }
 }
 scan(data,"");
 return [...out].filter(x=>x && !/^Q\\d/.test(x)).slice(0,80);
}
survey.onCurrentPageChanged.add(s=>{
 if(s.currentPage && s.currentPage.name==="hard"){
   const q=s.getQuestionByName("HARD_LIMITS");
   const items=collectHardCandidates(s.data);
   q.choices=[...items,"Autre limite non listée"];
 }
});

survey.onCompleting.add((s,opt)=>{
 if(s.data.AGE_OK==="NO"){
   opt.allowComplete=false;
   alert("Ce questionnaire est réservé aux personnes de 18 ans ou plus.");
 }
});

survey.onComplete.add(s=>{
 localStorage.removeItem(storageKey);
 const d=s.data;
 const txt=JSON.stringify(d);
 const out={
   questionnaire_version:"V1.3_FINAL_TON_EQUIBRE",
   completed_at:new Date().toISOString(),
   elapsed_minutes:Math.round((Date.now()-started)/600)/100,
   unknown_count:(txt.match(/UNKNOWN|Je ne sais pas/g)||[]).length,
   hard_limits:d.HARD_LIMITS||[],
   hard_other:d.HARD_OTHER||"",
   doctrine:{
     unknown_never_no:true,
     later_available_now:false,
     fantasy_is_commercial_permission:false,
     hard_only_if_explicitly_confirmed:true
   },
   RAW_RESPONSES:d
 };
 const box=document.getElementById("diag");
 box.style.display="block";
 box.innerHTML="<button id='dl'>Télécharger le JSON</button><button id='copy'>Copier le JSON</button><div class='note'>Questionnaire terminé. Le fichier exporté contient les réponses brutes et les limites HARD explicitement confirmées.</div><pre style='white-space:pre-wrap'>"+escapeHtml(JSON.stringify(out,null,2))+"</pre>";
 document.getElementById("dl").onclick=()=>{
   const a=document.createElement("a");
   a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
   a.download="profil-strategique-v1.3.json";
   a.click();
 };
 document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(JSON.stringify(out,null,2));
});
function escapeHtml(str){return str.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

survey.render(document.getElementById("survey"));
</script>
</body>
</html>
